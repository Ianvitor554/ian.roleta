services:
  - type: web
    name: mega-roulette-ai-24x7
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    maxShutdownDelaySeconds: 30

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11

      - key: API_URL
        value: https://api-cs.casino.org/svc-evolution-game-events/api/megaroulette?page=0&size=27&sort=data.settledAt,desc&duration=6&isLightningNumberMatched=false

      - key: DATA_DIR
        value: /var/data
      - key: DB_FILE
        value: /var/data/roulette_clean_ai.sqlite3
      - key: BACKUP_DIR
        value: /var/data/backups

      - key: RUN_COLLECTOR
        value: "1"
      - key: CLOUD_MODE
        value: "1"
      - key: COLLECT_INTERVAL
        value: "8"
      - key: MAX_BACKFILL_PAGES
        value: "80"
      - key: DEEP_SYNC_INTERVAL
        value: "1800"
      - key: BACKUP_INTERVAL
        value: "21600"
      - key: BACKUP_KEEP
        value: "14"

      - key: AI_MIN_SAMPLES
        value: "120"
      - key: GREEN_MIN_RESOLVED
        value: "120"
      - key: GREEN_SCORE
        value: "88"
      - key: GREEN_PLUS_SCORE
        value: "93"
      - key: GREEN_ELITE_SCORE
        value: "96"

      - key: PANEL_USER
        value: admin
      - key: PANEL_PASSWORD
        sync: false

    disk:
      name: mega-roulette-ai-data
      mountPath: /var/data
      sizeGB: 1

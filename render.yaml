services:
  - type: web
    name: mega-roulette-ai-v4-commander
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    maxShutdownDelaySeconds: 30

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11

      - key: RUN_COLLECTOR
        value: "1"
      - key: CLOUD_MODE
        value: "1"
      - key: COLLECT_INTERVAL
        value: "8"

      - key: DATA_DIR
        value: /var/data
      - key: DB_FILE
        value: /var/data/roulette_clean_ai.sqlite3
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: DB_QUARANTINE_DIR
        value: /var/data/backups/corrupt

      - key: DB_AUTO_RECOVER
        value: "1"
      - key: DB_CHECK_INTERVAL
        value: "900"
      - key: WAL_CHECKPOINT_INTERVAL
        value: "300"
      - key: BACKUP_INTERVAL
        value: "3600"
      - key: BACKUP_KEEP
        value: "14"

      - key: BOOTSTRAP_PAGES
        value: "5"
      - key: BOOTSTRAP_TARGET_SPINS
        value: "120"
      - key: MAX_BACKFILL_PAGES
        value: "80"
      - key: DEEP_SYNC_INTERVAL
        value: "1800"

      - key: AI_COMMANDER_ENABLED
        value: "1"
      - key: COMMANDER_MIN_SAMPLES
        value: "35"
      - key: COMMANDER_BOOTSTRAP_LIMIT
        value: "700"
      - key: COMMANDER_MIN_EDGE
        value: "0.015"
      - key: COMMANDER_EDGE_QUANTILE
        value: "0.68"
      - key: COMMANDER_MIN_AUTHORITY
        value: "0.50"
      - key: COMMANDER_EARLY_AUTHORITY
        value: "0.72"
      - key: COMMANDER_EARLY_EDGE
        value: "0.040"

      - key: FAST_BACKFILL_ANALYSIS
        value: "1"
      - key: STATUS_CACHE_SECONDS
        value: "2.0"
      - key: CENTER_COMBO_CANDIDATES
        value: "14"
      - key: COLLECTOR_HEARTBEAT_TIMEOUT
        value: "120"

      - key: PANEL_USER
        value: admin
      - key: PANEL_PASSWORD
        sync: false

    disk:
      name: mega-roulette-ai-data
      mountPath: /var/data
      sizeGB: 1

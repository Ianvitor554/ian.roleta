services:
  - type: web
    name: mega-roulette-ai-v401
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --keep-alive 5 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: RUN_COLLECTOR
        value: "1"
      - key: CLOUD_MODE
        value: "1"
      - key: COLLECT_INTERVAL
        value: "8"
      - key: DATA_DIR
        value: /var/data
      - key: DB_FILE
        value: /var/data/roulette_clean_ai.sqlite3
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: DB_QUARANTINE_DIR
        value: /var/data/backups/corrupt
      - key: DB_AUTO_RECOVER
        value: "1"
      - key: DB_READ_TIMEOUT
        value: "5"
      - key: AI_COMMANDER_ENABLED
        value: "1"
      - key: FAST_BACKFILL_ANALYSIS
        value: "1"
      - key: BOOTSTRAP_PAGES
        value: "5"
      - key: BOOTSTRAP_TARGET_SPINS
        value: "120"
      - key: MAX_BACKFILL_PAGES
        value: "80"
      - key: DEEP_SYNC_INTERVAL
        value: "1800"
      - key: BACKUP_INTERVAL
        value: "3600"
      - key: BACKUP_KEEP
        value: "14"
      - key: PANEL_USER
        value: admin
      - key: PANEL_PASSWORD
        sync: false
    disk:
      name: mega-roulette-ai-data
      mountPath: /var/data
      sizeGB: 1
